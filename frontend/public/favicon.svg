<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">CocoLoop Dot Matrix C Favicon</title>
  <desc id="desc">Nothing-inspired monochrome dot matrix C mark</desc>
  <style>
    .bg { fill: #ffffff; }
    .dot { fill: #000000; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #000000; }
      .dot { fill: #ffffff; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="64" height="64" rx="10" />

  <g class="dot">
    <!-- top row -->
    <circle cx="20" cy="12" r="3" />
    <circle cx="28" cy="12" r="3" />
    <circle cx="36" cy="12" r="3" />
    <circle cx="44" cy="12" r="3" />

    <!-- left column -->
    <circle cx="12" cy="20" r="3" />
    <circle cx="12" cy="28" r="3" />
    <circle cx="12" cy="36" r="3" />
    <circle cx="12" cy="44" r="3" />

    <!-- bottom row -->
    <circle cx="20" cy="52" r="3" />
    <circle cx="28" cy="52" r="3" />
    <circle cx="36" cy="52" r="3" />
    <circle cx="44" cy="52" r="3" />
  </g>
</svg>
