name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -e './backend[dev]'

      - name: Run backend tests
        run: |
          cd backend
          pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        run: |
          cd frontend
          npm ci
          npm run build

  scripts-and-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shell lint
        run: |
          shellcheck scripts/opsctl.sh
          shellcheck scripts/ops_http.sh
          shellcheck scripts/ops/deploy.sh
          shellcheck scripts/service_ctl.sh
          shellcheck webhook/deploy.sh

      - name: Python syntax check (webhook)
        run: |
          python3 -m py_compile webhook/main.py webhook/config.py webhook/job_runner.py
